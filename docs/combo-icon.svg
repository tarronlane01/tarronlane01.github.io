<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="lg-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#646cff"/>
      <stop offset="100%" style="stop-color:#535bf2"/>
    </linearGradient>
    <linearGradient id="lg-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <clipPath id="clip-l">
      <rect x="0" y="0" width="16" height="32"/>
    </clipPath>
    <clipPath id="clip-r">
      <rect x="16" y="0" width="16" height="32"/>
    </clipPath>
  </defs>
  <!-- Circle split: purple left (budget), green right (packing) -->
  <circle cx="16" cy="16" r="15" fill="url(#lg-purple)" clip-path="url(#clip-l)"/>
  <circle cx="16" cy="16" r="15" fill="url(#lg-green)" clip-path="url(#clip-r)"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="13.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Divider -->
  <line x1="16" y1="1.5" x2="16" y2="30.5" stroke="rgba(255,255,255,0.4)" stroke-width="0.75"/>
  <!-- Dollar sign (budget, left side) -->
  <text x="9.5" y="21.5" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="700" fill="white">$</text>
  <!-- Suitcase (packing, right side) -->
  <path d="M19 15 L19 12.5 Q19 11 20.5 11 L23.5 11 Q25 11 25 12.5 L25 15" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="17.5" y="15" width="9" height="7" rx="1" fill="white"/>
  <line x1="17.5" y1="18.5" x2="26.5" y2="18.5" stroke="rgba(5,150,105,0.35)" stroke-width="0.75"/>
  <rect x="20.5" y="17" width="3" height="2.5" rx="0.4" fill="rgba(5,150,105,0.5)"/>
</svg>
